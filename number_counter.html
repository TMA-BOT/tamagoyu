<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
:root{--green:#2d6a4f;--green-l:#d8f3dc;--bg:#f0f4f1;--surface:#fff;--border:#e2e8f0;--text:#1a202c;--t2:#4a5568;--t3:#a0aec0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:15px;font-weight:700;}
.sync-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.2);}
.btn-tab{padding:5px 12px;border-radius:20px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;}
.btn-tab.active{background:#fff;color:var(--green);}
.btn-sm{padding:5px 10px;border-radius:20px;border:none;font-size:11px;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;}
.content{padding:12px;}
.card{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.sec{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px;}
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.date-bar input[type=date]{flex:1;padding:6px 10px;border:.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);}
.date-bar label{font-size:11px;color:var(--t3);white-space:nowrap;}
.search-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--bg);border:.5px solid var(--border);border-radius:10px;padding:8px 12px;}
.search-bar input{flex:1;border:none;background:none;font-size:13px;color:var(--text);outline:none;}
.search-bar input::placeholder{color:var(--t3);}
.search-results{margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
.sri{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--green-l);border-radius:8px;cursor:pointer;}
.sri:active{background:var(--green);color:#fff;}
.sri-name{font-size:13px;font-weight:700;color:var(--green);}
.sri-pref{font-size:11px;color:var(--t2);}
.pref-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px;}
.pref-btn{padding:7px 2px;border-radius:8px;border:.5px solid var(--border);background:#f7fafc;font-size:11px;font-weight:600;cursor:pointer;text-align:center;}
.pref-btn.sel{background:var(--green);color:#fff;border-color:var(--green);}
.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;}
.region-btn{padding:9px 4px;border-radius:8px;border:.5px solid var(--border);background:var(--green-l);font-size:12px;font-weight:600;cursor:pointer;text-align:center;}
.region-btn:active{background:var(--green);color:#fff;}
.recent{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;}
.rtag{padding:4px 10px;border-radius:20px;background:#e8f4f8;font-size:12px;color:#2b6cb0;font-weight:600;display:flex;align-items:center;gap:4px;animation:pop .2s ease;}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.rtag button{background:none;border:none;color:var(--t3);font-size:11px;cursor:pointer;}
.total-badge{background:var(--green);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:12px;display:inline-block;}
.rank-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid #f0f4f8;animation:slideIn .3s ease backwards;}
@keyframes slideIn{from{transform:translateX(-8px);opacity:0}to{transform:translateX(0);opacity:1}}
.rank-item:last-child{border-bottom:none;}
.rank-name-wrap{flex:1;display:flex;align-items:baseline;gap:3px;}
.rank-name{font-size:13px;font-weight:600;}
.rank-pref{font-size:10px;color:var(--t3);}
.rank-bar-wrap{flex:2;background:#e2e8f0;border-radius:20px;height:10px;overflow:hidden;}
.rank-bar{height:10px;border-radius:20px;}
.rank-num{font-size:15px;font-weight:700;color:var(--green);min-width:32px;text-align:right;}
.rank-del{width:22px;height:22px;border-radius:50%;border:none;background:#fee2e2;color:#e53e3e;font-size:11px;cursor:pointer;flex-shrink:0;}
.empty{text-align:center;padding:32px;color:var(--t3);font-size:13px;}
@media print{
  @page{size:A4 landscape;margin:8mm;}
  body *{print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .header,.date-bar button,#view-input,.btn-tab,.btn-sm,.rank-del,.sync-badge,.no-print-btn{display:none!important;}
  #view-stats{display:block!important;}
  body{background:#fff!important;}
  .card{box-shadow:none!important;border:.5px solid #e2e8f0!important;page-break-inside:avoid;}
}
</style>
</head>
<body>
<div class="header">
  <h1>🚗 車 地域別集計</h1>
  <div style="display:flex;gap:6px;align-items:center;">
    <span class="sync-badge" id="sync-badge">●同期中...</span>
    <button class="btn-tab active" id="tab-input" onclick="showTab('input')">入力</button>
    <button class="btn-tab" id="tab-stats" onclick="showTab('stats')">集計</button>
    <button class="btn-sm" onclick="clearToday()">クリア</button>
  </div>
</div>

<div id="view-input" class="content">
  <div class="card">
    <div class="date-bar"><label>集計日：</label><input type="date" id="date-input"></div>
    <div class="sec">🔍 地域名で検索</div>
    <div class="search-bar">
      <span style="font-size:14px;">🔍</span>
      <input type="text" id="search-input" placeholder="例：品川、仙台、なにわ..." oninput="onSearch(this.value)">
      <button onclick="clearSearch()" style="background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;">✕</button>
    </div>
    <div class="search-results" id="search-results"></div>
    <div class="sec">都道府県から選択</div>
    <div class="pref-grid" id="pref-grid"></div>
    <div id="region-area" style="display:none;">
      <div style="font-size:11px;color:var(--t2);font-weight:700;margin-bottom:5px;" id="region-label"></div>
      <div class="region-grid" id="region-grid"></div>
    </div>
  </div>
  <div class="card">
    <div class="sec">最近追加（✕で取り消し）</div>
    <div class="recent" id="recent-list"></div>
  </div>
</div>

<div id="view-stats" class="content" style="display:none;">
  <!-- 日別 / 月別 切替 -->
  <div style="display:flex;gap:6px;margin-bottom:10px;">
    <button id="stats-tab-day" onclick="setStatsMode('day')" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;">日別</button>
    <button id="stats-tab-month" onclick="setStatsMode('month')" style="flex:1;padding:7px;border-radius:8px;border:.5px solid var(--border);background:none;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;">月集計</button>
  </div>
  <!-- 日別 -->
  <div id="stats-day-area">
    <div class="date-bar"><label>表示日：</label><input type="date" id="date-stats">
      <button onclick="loadStats()" style="padding:6px 14px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;">更新</button>
    </div>
  </div>
  <!-- 月別 -->
  <div id="stats-month-area" style="display:none;">
    <div class="date-bar">
      <label>年月：</label>
      <input type="month" id="month-stats" style="flex:1;padding:6px 10px;border:.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);">
      <button onclick="loadMonthStats()" style="padding:6px 14px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;">集計</button>
    </div>
    <div id="month-progress" style="display:none;font-size:12px;color:var(--t3);margin-bottom:8px;text-align:center;">読み込み中...</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
    <div class="total-badge" id="total-badge">🚗 0台</div>
    <button onclick="showTab('stats');setTimeout(function(){window.print();},300);" style="padding:6px 16px;border-radius:20px;border:.5px solid #2b6cb0;background:#e8f4f8;color:#2b6cb0;font-size:12px;font-weight:700;cursor:pointer;" class="no-print-btn">🖨 印刷</button>
  </div>
  <div class="card">
    <div class="sec" style="margin-bottom:10px;">地域名ランキング</div>
    <div id="rank-list"><div class="empty">データがありません</div></div>
  </div>
  <div class="card">
    <div class="sec" style="margin-bottom:10px;">県別ランキング</div>
    <div id="pref-rank-list"><div class="empty">データがありません</div></div>
  </div>
</div>

<script>
// 国土交通省公式データに基づく正確なナンバープレート地域名
const ND={
  '北海道':['札幌','函館','旭川','室蘭','釧路','帯広','北見','苫小牧','知床','十勝','網走'],
  '青森':['青森','弘前','八戸'],
  '岩手':['盛岡','岩手','平泉'],
  '宮城':['仙台','宮城'],
  '秋田':['秋田'],
  '山形':['山形','庄内'],
  '福島':['福島','会津','郡山','白河','いわき'],
  '茨城':['水戸','土浦','つくば'],
  '栃木':['宇都宮','とちぎ','日光','那須'],
  '群馬':['前橋','高崎','群馬'],
  '埼玉':['大宮','川口','熊谷','春日部','所沢','越谷','川越'],
  '千葉':['千葉','習志野','柏','野田','松戸','市川','船橋','成田','袖ケ浦','市原'],
  '東京':['品川','足立','練馬','多摩','八王子','世田谷','杉並','板橋','江東','葛飾','江戸川'],
  '神奈川':['横浜','川崎','湘南','相模'],
  '山梨':['山梨','富士山'],
  '新潟':['新潟','長岡','上越'],
  '長野':['長野','松本','諏訪','南信州','安曇野'],
  '富山':['富山'],
  '石川':['金沢','石川'],
  '福井':['福井'],
  '岐阜':['岐阜','飛騨'],
  '静岡':['静岡','浜松','沼津','富士山','伊豆'],
  '愛知':['名古屋','岡崎','豊田','豊橋','一宮','春日井','三河','尾張小牧'],
  '三重':['三重','鈴鹿','四日市','伊勢志摩'],
  '滋賀':['滋賀','彦根'],
  '京都':['京都'],
  '大阪':['大阪','なにわ','和泉','堺'],
  '兵庫':['神戸','姫路'],
  '奈良':['奈良','飛鳥'],
  '和歌山':['和歌山'],
  '鳥取':['鳥取'],
  '島根':['島根','出雲'],
  '岡山':['岡山','倉敷'],
  '広島':['広島','福山'],
  '山口':['山口','下関','岩国'],
  '徳島':['徳島'],
  '香川':['香川','高松'],
  '愛媛':['愛媛'],
  '高知':['高知'],
  '福岡':['福岡','北九州','久留米','筑豊','筑後'],
  '佐賀':['佐賀'],
  '長崎':['長崎','佐世保'],
  '熊本':['熊本'],
  '大分':['大分'],
  '宮崎':['宮崎'],
  '鹿児島':['鹿児島'],
  '沖縄':['沖縄'],
};

const R2P={};
Object.entries(ND).forEach(([p,rs])=>{
  rs.forEach(r=>{R2P[r]=p;});
  R2P[p]=p; // 都道府県名自体も登録
});
const PREFS=Object.keys(ND);
let selPref=null,cData={},recent=[],_unsub=null;

const getDK=()=>document.getElementById('date-input').value||new Date().toISOString().slice(0,10);

function onSearch(q){
  const el=document.getElementById('search-results');
  if(!q.trim()){el.innerHTML='';return;}
  const results=[];
  Object.entries(ND).forEach(([p,rs])=>rs.forEach(r=>{
    if(r.includes(q)||p.includes(q))results.push({r,p});
  }));
  if(!results.length){el.innerHTML='<div style="font-size:12px;color:var(--t3);padding:6px 0;">見つかりませんでした</div>';return;}
  el.innerHTML=results.slice(0,8).map(({r,p})=>
    `<div class="sri" onclick="addR('${r}','${p}')">
      <div><div class="sri-name">${r}</div><div class="sri-pref">${p}</div></div>
      <div style="font-size:18px;color:var(--green);">＋</div>
    </div>`).join('');
}
function clearSearch(){document.getElementById('search-input').value='';document.getElementById('search-results').innerHTML='';}
function renderPrefs(){
  document.getElementById('pref-grid').innerHTML=PREFS.map(p=>
    `<button class="pref-btn${selPref===p?' sel':''}" onclick="selP('${p}')">${p}</button>`).join('');
}
function selP(p){
  selPref=p;renderPrefs();
  document.getElementById('region-label').textContent=p+' のナンバー';
  document.getElementById('region-grid').innerHTML=(ND[p]||[]).map(r=>
    `<button class="region-btn" onclick="addR('${r}','${p}')">${r}</button>`).join('');
  document.getElementById('region-area').style.display='';
}
function renderPrefDirect(){
  document.getElementById('pref-direct-grid').innerHTML=PREFS.map(p=>
    `<button class="region-btn" onclick="addR('${p}','${p}')" style="position:relative;">
      ${p}
      <span id="pc-${p}" style="position:absolute;top:2px;right:4px;font-size:9px;font-weight:700;color:var(--green);"></span>
    </button>`).join('');
  updatePrefDirectCounts();
}
function updatePrefDirectCounts(){
  const dk=getDK();
  const data=cData[dk]||{};
  PREFS.forEach(p=>{
    const el=document.getElementById('pc-'+p);
    if(!el)return;
    const cnt=data[p]||0;
    el.textContent=cnt>0?cnt:'';
  });
}
// Firebase同期
function getFirebaseKey(dk){return 'number_counter/'+dk;}
function syncToFirebase(dk){
  try{
    _ncDatabase.ref(getFirebaseKey(dk)).set(cData[dk]||{});
  }catch(e){console.error('sync error:',e);}
}
function startSync(dk){
  if(_unsub){_unsub();_unsub=null;}
  try{
    _unsub=_ncDatabase.ref(getFirebaseKey(dk)).on('value',function(snap){
      const remote=snap.exists()?snap.val():{};
      cData[dk]=remote;
      saveLocal();
      updatePrefDirectCounts();
      if(document.getElementById('view-stats').style.display!=='none')loadStats();
      setSyncBadge(true);
    });
  }catch(e){
    console.error('startSync error:',e);
    setSyncBadge(false);
  }
}
function setSyncBadge(ok){
  const b=document.getElementById('sync-badge');
  if(!b)return;
  b.textContent=ok?'●同期済':'●オフライン';
  b.style.background=ok?'rgba(255,255,255,.25)':'rgba(255,100,100,.4)';
}
function saveLocal(){try{localStorage.setItem('nc5',JSON.stringify(cData));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem('nc5');if(r)cData=JSON.parse(r);}catch(e){}}

function init(){
  const params=new URLSearchParams(window.location.search);
  const urlDate=params.get('date');
  const t=urlDate||new Date().toISOString().slice(0,10);
  document.getElementById('date-input').value=t;
  document.getElementById('date-stats').value=t;
  loadLocal();
  renderPrefs();renderRecent();
  // compat SDKは同期的に使えるのでそのまま開始
  startSync(getDK());
  document.getElementById('date-input').addEventListener('change',function(){
    startSync(this.value);
    updatePrefDirectCounts();
  });
}

function addR(r,p){
  const dk=getDK();
  if(!cData[dk])cData[dk]={};
  cData[dk][r]=(cData[dk][r]||0)+1;
  saveLocal();
  syncToFirebase(dk);
  recent.unshift({r,p:p||R2P[r]||''});
  if(recent.length>15)recent.pop();
  renderRecent();
  updatePrefDirectCounts();
  document.querySelectorAll('.region-btn,.sri').forEach(b=>{
    const nm=b.querySelector('.sri-name')||b;
    if(nm.textContent===r){
      b.style.background='#2d6a4f';b.style.color='#fff';
      setTimeout(()=>{b.style.background='';b.style.color='';},250);
    }
  });
  showToast(r+' ('+( p||R2P[r]||'')+') を追加');
}
function remRecent(i){
  const item=recent[i];if(!item)return;
  const dk=getDK();
  if(cData[dk]?.[item.r]>0){
    cData[dk][item.r]--;
    if(!cData[dk][item.r])delete cData[dk][item.r];
    saveLocal();syncToFirebase(dk);
  }
  recent.splice(i,1);renderRecent();
}
function renderRecent(){
  const el=document.getElementById('recent-list');
  if(!recent.length){el.innerHTML='<span style="color:#a0aec0;font-size:12px;">まだありません</span>';return;}
  el.innerHTML=recent.slice(0,12).map((r,i)=>
    `<div class="rtag">${r.r}<span style="font-size:10px;color:var(--t3);margin-left:2px;">(${r.p})</span><button onclick="remRecent(${i})">✕</button></div>`).join('');
}

function showTab(tab){
  document.getElementById('view-input').style.display=tab==='input'?'':'none';
  document.getElementById('view-stats').style.display=tab==='stats'?'':'none';
  document.getElementById('tab-input').className='btn-tab'+(tab==='input'?' active':'');
  document.getElementById('tab-stats').className='btn-tab'+(tab==='stats'?' active':'');
  if(tab==='stats')loadStats();
}
let statsMode='day';
function setStatsMode(mode){
  statsMode=mode;
  const dayBtn=document.getElementById('stats-tab-day');
  const monBtn=document.getElementById('stats-tab-month');
  const dayArea=document.getElementById('stats-day-area');
  const monArea=document.getElementById('stats-month-area');
  if(mode==='day'){
    dayBtn.style.cssText='flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
    monBtn.style.cssText='flex:1;padding:7px;border-radius:8px;border:.5px solid var(--border);background:none;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;';
    dayArea.style.display='';monArea.style.display='none';
    loadStats();
  } else {
    dayBtn.style.cssText='flex:1;padding:7px;border-radius:8px;border:.5px solid var(--border);background:none;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;';
    monBtn.style.cssText='flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
    dayArea.style.display='none';monArea.style.display='';
    // 今月をデフォルト設定
    const t=new Date();
    const ym=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
    document.getElementById('month-stats').value=ym;
  }
}

function loadMonthStats(){
  const ym=document.getElementById('month-stats').value;
  if(!ym)return;
  const [year,month]=ym.split('-').map(Number);
  const days=new Date(year,month,0).getDate();
  const prog=document.getElementById('month-progress');
  prog.style.display='';
  prog.textContent='0/'+days+'日 読み込み中...';

  // 全日付のデータをFirebaseから取得
  const merged={};
  let loaded=0;
  const dkeys=[];
  for(let d=1;d<=days;d++){
    const dk=year+'-'+String(month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    dkeys.push(dk);
  }

  function checkDone(){
    loaded++;
    prog.textContent=loaded+'/'+days+'日 読み込み中...';
    if(loaded===days){
      prog.style.display='none';
      renderStats(merged,'月集計：'+year+'年'+month+'月（'+days+'日分）');
    }
  }

  dkeys.forEach(function(dk){
    // Firebaseから取得
    if(typeof _ncDatabase!=='undefined'){
      try{
        _ncDatabase.ref('number_counter/'+dk).once('value',function(snap){
          if(snap.exists()){
            const d=snap.val();
            Object.entries(d).forEach(function([k,v]){merged[k]=(merged[k]||0)+v;});
          }
          // localStorageもマージ
          try{const raw=localStorage.getItem('nc5');if(raw){const all=JSON.parse(raw);if(all[dk])Object.entries(all[dk]).forEach(function([k,v]){merged[k]=Math.max(merged[k]||0,v);});}}catch(e){}
          checkDone();
        });
      }catch(e){
        try{const raw=localStorage.getItem('nc5');if(raw){const all=JSON.parse(raw);if(all[dk])Object.entries(all[dk]).forEach(function([k,v]){merged[k]=(merged[k]||0)+v;});}}catch(e2){}
        checkDone();
      }
    } else {
      try{const raw=localStorage.getItem('nc5');if(raw){const all=JSON.parse(raw);if(all[dk])Object.entries(all[dk]).forEach(function([k,v]){merged[k]=(merged[k]||0)+v;});}}catch(e){}
      checkDone();
    }
  });
}

function renderStats(data,label){
  const total=Object.values(data).reduce(function(s,v){return s+v;},0);
  document.getElementById('total-badge').textContent='🚗 '+label+' 合計'+total+'台';
  const entries=Object.entries(data).sort(function(a,b){return b[1]-a[1];});
  if(!entries.length){
    document.getElementById('rank-list').innerHTML='<div class="empty">データがありません</div>';
    document.getElementById('pref-rank-list').innerHTML='<div class="empty">データがありません</div>';
    return;
  }
  const mx=entries[0][1];
  const medals=['🥇','🥈','🥉'];
  const bc=['#1b5e20','#2e7d32','#388e3c','#4caf50','#81c784'];
  document.getElementById('rank-list').innerHTML=entries.map(function([n,c],i){return (
    '<div class="rank-item" style="animation-delay:'+i*0.02+'s">'
    +'<div style="font-size:15px;min-width:22px;text-align:center">'+(medals[i]||'')+'</div>'
    +'<div style="font-size:11px;color:#a0aec0;min-width:18px;text-align:center">'+(i>=3?i+1:'')+'</div>'
    +'<div class="rank-name-wrap"><span class="rank-name">'+n+'</span><span class="rank-pref">'+(R2P[n]||'')+'</span></div>'
    +'<div class="rank-bar-wrap"><div class="rank-bar" style="width:'+Math.round(c/mx*100)+'%;background:'+bc[Math.min(i,4)]+'"></div></div>'
    +'<div class="rank-num">'+c+'</div>'
    +'<button class="rank-del" style="visibility:hidden">✕</button>'
    +'</div>');}).join('');
  // 県別
  const prefCounts={};
  entries.forEach(function([n,c]){const p=R2P[n]||n;prefCounts[p]=(prefCounts[p]||0)+c;});
  const prefEntries=Object.entries(prefCounts).sort(function(a,b){return b[1]-a[1];});
  const pmx=prefEntries[0][1];
  document.getElementById('pref-rank-list').innerHTML=prefEntries.map(function([p,c],i){return (
    '<div class="rank-item" style="animation-delay:'+i*0.02+'s">'
    +'<div style="font-size:15px;min-width:22px;text-align:center">'+(medals[i]||'')+'</div>'
    +'<div style="font-size:11px;color:#a0aec0;min-width:18px;text-align:center">'+(i>=3?i+1:'')+'</div>'
    +'<div class="rank-name-wrap"><span class="rank-name">'+p+'</span></div>'
    +'<div class="rank-bar-wrap"><div class="rank-bar" style="width:'+Math.round(c/pmx*100)+'%;background:'+bc[Math.min(i,4)]+'"></div></div>'
    +'<div class="rank-num">'+c+'</div>'
    +'</div>');}).join('');
}
function loadStats(){
  const dk=document.getElementById('date-stats').value;
  renderStats(cData[dk]||{},formatDate2(dk));
}
function formatDate2(dk){
  const d=new Date(dk+'T00:00:00');
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function delR(n,dk){if(cData[dk])delete cData[dk][n];saveLocal();syncToFirebase(dk);loadStats();}
function clearToday(){
  const dk=getDK();
  if(!confirm(dk+' のデータをクリアしますか？'))return;
  cData[dk]={};saveLocal();syncToFirebase(dk);
  recent=[];renderRecent();
  if(document.getElementById('view-stats').style.display!=='none')loadStats();
  showToast('クリアしました');
}
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a202c;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;max-width:90vw;text-align:center;';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}
init();
</script>
